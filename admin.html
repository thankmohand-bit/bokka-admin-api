<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOKKA FOX ADMIN</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
}
header {
    background: #17243a;
    padding: 22px;
    text-align: center;
    color: #38d9a9;
}
main {
    padding: 18px;
    max-width: 500px;
    margin: auto;
}
.card {
    background: #1c2b42;
    padding: 18px;
    margin-bottom: 15px;
    border-radius: 12px;
}
button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    background: #38d9a9;
    font-size: 16px;
    font-weight: bold;
}
</style>
</head>
<body>
<header>
    <h2>BOKKA FOX</h2>
    <p>لوحة إدارة تجريبية</p>
</header>
<main>
    <div class="card">
        <h3>حالة الخادم</h3>
        <p id="status">جارٍ الاتصال بالخادم...</p>
        <button onclick="checkServer()">اختبار الخادم</button>
    </div>
    <div class="card">
        <h3>إدارة الحسابات</h3>
        <p>سيتم إعدادها بعد تجهيز قاعدة البيانات والحماية.</p>
    </div>
    <div class="card">
        <h3>إدارة الأرصدة</h3>
        <p>هذه الواجهة تجريبية ولا تعدّل أي أرصدة.</p>
    </div>
</main>
<script>
async function checkServer() {
    const status = document.getElementById("status");
    status.textContent = "جارٍ الاتصال...";
    try {
        const response = await fetch(
            "/api/status"
        );
        const data = await response.json();
        status.textContent = data.status === "success"
            ? "الخادم يعمل بنجاح ✅"
            : "الخادم استجاب، لكن الحالة غير متوقعة";
    } catch (error) {
        status.textContent = "تعذر الاتصال بالخادم حالياً";
    }
}
checkServer();
</script>
</body>
</html>
